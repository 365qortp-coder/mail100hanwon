name: IndexNow

# INDEXNOW-01 (2026-11-21) — 새로 나온·고친 칼럼 주소를 네이버·빙에 바로 알린다.
# 칼럼 자동 발행(gap-column, 09:00) 뒤 배포가 끝날 시간을 두고 11:30에 돈다.
# 사이트 지도에서 최근 2일 안에 lastmod가 바뀐 칼럼만 보낸다 (같은 주소를 매일 보내지 않게).
# /gongjindan 아래는 보내지 않는다 — 공진단은 gongjindan.io.kr 로 옮기는 중(301 대기).
# 확인 키 파일: public/a798bfafd689d3865c2b366e932b196a.txt (공개 값, 지우면 알림이 막힘)
on:
  schedule:
    - cron: "30 2 * * *" # 11:30 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 최근 칼럼을 검색엔진에 알리기
        run: >
          node scripts/indexnow.mjs --host mail100hanwon.co.kr --key a798bfafd689d3865c2b366e932b196a
          --sitemap --days 2 --include "/columns/." --exclude "^/gongjindan"
